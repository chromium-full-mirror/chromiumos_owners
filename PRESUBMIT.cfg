[Hook Scripts]
cros format = cros format --check --commit ${PRESUBMIT_COMMIT} ${PRESUBMIT_FILES}
cros lint = cros lint --commit ${PRESUBMIT_COMMIT} ${PRESUBMIT_FILES}
check owners = ./check-owners.py ${PRESUBMIT_FILES}

[Hook Overrides]
bug_field_check = false
test_field_check = false
# cros lint enforces line limits for us.
long_line_check = false
